# Self-hosted stack: Supabase (db, auth, rest, storage, kong) + the app + a cron scheduler, on one
# machine, with no Supabase cloud and no Vercel. See RUNBOOK.md.
#
#   docker compose -f deploy/local/docker-compose.yml --env-file deploy/local/.env up -d --build
#   (optional) --profile studio   Supabase Studio + pg-meta, on 127.0.0.1:${STUDIO_PORT}
#   (optional) --profile mail     Mailpit: catches auth emails, inbox on 127.0.0.1:${MAILPIT_PORT}
#
# The Supabase services follow github.com/supabase/supabase/docker, trimmed to what this app uses
# (no realtime, edge functions, imgproxy, analytics or pooler).
#
# Boot order: db healthy -> auth + storage healthy (each runs its own auth.* / storage.* schema
# migrations on boot) -> `migrate` (scripts/migrate-inner.sh) applies supabase/migrations, which
# need both schemas -> the app starts only once migrate has exited 0. So `up` = deploy + migrate:
# already-applied files are skipped, and a failed migration stops the app from being (re)started.
# supabase/pending-deploy is never applied (not mounted). scripts/migrate.sh runs the same service
# by hand and then checks the result.

name: portfolio-local

x-labels: &labels
  # Optional: lets a supervisor (e.g. Agent Orchestrator) find and reap this stack's containers.
  ao.session: "${AO_SESSION:-}"

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    labels: *labels
    # Loopback only, and not 5432, so a Postgres already on the host keeps its port.
    # The host-side supabase CLI (scripts/migrate.sh) connects here.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54322}:5432"
    volumes:
      # Set the service roles' passwords to POSTGRES_PASSWORD (first boot only).
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-keys.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    labels: *labels
    depends_on:
      db:
        condition: service_healthy
      mail-templates:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      # supabase_auth_admin: the only role granted execute on the signup hook below.
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      # Mirrors supabase/config.toml [auth] / [auth.email].
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-false}
      GOTRUE_MAILER_EXTERNAL_HOSTS: ${MAILER_EXTERNAL_HOSTS:-}
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_PASSWORD_MIN_LENGTH: 6
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # The app ships TOTP MFA enrolment and verification: set, not left to GoTrue's defaults.
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?run scripts/gen-keys.sh}
      # The signup allow-list (supabase/migrations/*before_user_created_hook.sql). Without it
      # anyone who can reach /auth/v1/signup gets an account.
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: "true"
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: pg-functions://postgres/public/hook_before_user_created
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      # GoTrue parses this as an int whenever it is set, so a blank SMTP_PORT must not reach it.
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # The app signs in, confirms and resets with a 6-digit code (verifyOtp), so GoTrue must send
      # supabase/templates (which carry {{ .Token }}), not its link-only defaults.
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://mail-templates:8080/magic_link.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://mail-templates:8080/recovery.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://mail-templates:8080/confirmation.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://mail-templates:8080/email_change.html
      GOTRUE_MAILER_TEMPLATES_INVITE: http://mail-templates:8080/invite.html
      GOTRUE_MAILER_TEMPLATES_REAUTHENTICATION: http://mail-templates:8080/reauthentication.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your sign-in code
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Reset your password
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirm your email address
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: Confirm your new email address
      GOTRUE_MAILER_SUBJECTS_INVITE: You've been invited
      GOTRUE_MAILER_SUBJECTS_REAUTHENTICATION: Your verification code

  # Serves supabase/templates to GoTrue, which loads email templates only from URLs. Internal only:
  # no host port, no Traefik route.
  mail-templates:
    image: busybox:1.37.0
    restart: unless-stopped
    labels: *labels
    command: ["httpd", "-f", "-p", "8080", "-h", "/templates"]
    volumes:
      - ../../supabase/templates:/templates:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/magic_link.html"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    labels: *labels
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      # Unpaginated reads are capped here. supabase/config.toml says 1000; the app pages some
      # reads at 1000 itself, but not all, so the cap is raised (RUNBOOK.md, "Row cap").
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-10000}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost

  storage:
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    labels: *labels
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - storage-data:/var/lib/storage
    environment:
      ANON_KEY: ${ANON_KEY:?run scripts/gen-keys.sh}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?run scripts/gen-keys.sh}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      # Global upload cap; each bucket's own file_size_limit applies under it. 2 GiB is the
      # largest bucket limit (diligence-recordings).
      FILE_SIZE_LIMIT: 2147483648
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: stub
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    labels: *labels
    networks:
      default:
        # The app runs inside this container's network namespace (see `app`), so `app` must
        # resolve here for the scheduler.
        aliases: [app]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KONG_HTTP_PORT:-8000}:8000"
      # The app's port, published here because the app shares this network namespace. Direct to
      # `next start`: no proxy and so no proxy timeout between the browser and the app.
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./kong/kong.yml:/home/kong/temp.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      # No Admin API (it would listen on 127.0.0.1:8001, which the app shares, and could replace
      # this config). The config is declarative; nothing here needs it.
      KONG_ADMIN_LISTEN: "off"
      KONG_DNS_ORDER: LAST,A,CNAME
      # Containers get a new IP whenever they are recreated or restarted (backup.sh and restore.sh
      # stop and start rest, auth and storage), and each Kong worker caches DNS on its own. With
      # Kong 2.8's defaults a worker kept the dead IP for up to 10 minutes: intermittent 502s, and
      # once a 200 with an empty result. Re-resolve within 5 s, never serve a stale answer, and
      # forget "not found" (a stopped service) after 1 s.
      KONG_DNS_VALID_TTL: 5
      KONG_DNS_STALE_TTL: 0
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_NGINX_HTTP_CLIENT_MAX_BODY_SIZE: "0"
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'

  # One-shot: applies supabase/migrations, then exits. The app waits for it to exit 0.
  migrate:
    image: supabase/postgres:17.6.1.136   # the db's image, for psql: nothing extra to pull
    restart: "no"
    labels: *labels
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    # Only these two: supabase/pending-deploy must never be applied.
    volumes:
      - ../../supabase/migrations:/migrations:ro
      - ./scripts/migrate-inner.sh:/usr/local/bin/migrate-inner.sh:ro
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["bash", "/usr/local/bin/migrate-inner.sh"]

  app:
    build:
      context: ../..
      dockerfile: deploy/local/app.Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
        # The older name, still read first by the Google OAuth routes (app/api/auth/google/*).
        NEXT_PUBLIC_APP_URL: ${SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_TERMS_URL: ${NEXT_PUBLIC_TERMS_URL:-}
        NEXT_PUBLIC_PRIVACY_URL: ${NEXT_PUBLIC_PRIVACY_URL:-}
        NEXT_PUBLIC_DISABLE_SW: ${NEXT_PUBLIC_DISABLE_SW:-}
    image: portfolio-local-app:latest
    restart: unless-stopped
    labels: *labels
    # NEXT_PUBLIC_SUPABASE_URL is compiled into the server bundle as well as the browser's, so
    # the server calls the same http://localhost:8000 the browser does. Sharing Kong's network
    # namespace makes that localhost Kong, and makes SITE_URL (http://localhost:3000) this app,
    # which the agent's self-requests to the PDF routes depend on. See RUNBOOK.md.
    network_mode: "service:kong"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
        restart: true
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    # An allow-list, not the whole .env: the app never sees JWT_SECRET (mints any token,
    # service_role included), POSTGRES_PASSWORD (shared by the service roles) or
    # PG_META_CRYPTO_KEY. A bare name passes the .env value when set and nothing when unset; to
    # give the app another variable, add its name here.
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${SITE_URL:-http://localhost:3000}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run scripts/gen-keys.sh}
      CRON_SECRET: ${CRON_SECRET:?run scripts/gen-keys.sh}
      CHROME_EXECUTABLE_PATH: /usr/bin/chromium
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      OPENROUTER_API_KEY:
      RESEND_API_KEY:
      POSTMARK_SERVER_TOKEN:
      MAILGUN_API_KEY:
      MAILGUN_WEBHOOK_SIGNING_KEY:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      DEEPGRAM_API_KEY:
      DEEPGRAM_MODEL:
      TRANSCRIPTION_WEBHOOK_URL:
      EMAIL_FROM:
      AGENT_DESTRUCTIVE_ACTIONS:
      ENABLE_SETUP_PAGE:
      CUTOVER_SKIP_VEHICLES:

  scheduler:
    build:
      context: ./cron
      dockerfile_inline: |
        FROM alpine:3.24.2
        RUN apk add --no-cache curl
        COPY run-cron entrypoint.sh /usr/local/bin/
        COPY crontab /etc/crontabs/root
        ENTRYPOINT ["/bin/sh", "/usr/local/bin/entrypoint.sh"]
    image: portfolio-local-scheduler:latest
    restart: unless-stopped
    labels: *labels
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET}
      APP_URL: http://app:3000

  # ── Optional ──────────────────────────────────────────────────────────────────────────────────
  meta:
    profiles: [studio]
    image: supabase/postgres-meta:v0.99.0
    restart: unless-stopped
    labels: *labels
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-}

  studio:
    profiles: [studio]
    image: supabase/studio:2026.09.07-sha-7996410
    restart: unless-stopped
    labels: *labels
    depends_on:
      - meta
    # Studio has no login of its own here: keep it on loopback.
    ports:
      - "127.0.0.1:${STUDIO_PORT:-54323}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:-}
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-10000}
      DEFAULT_ORGANIZATION_NAME: Local
      DEFAULT_PROJECT_NAME: Portfolio
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"

  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    labels: *labels
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-54324}:8025"

volumes:
  db-data:
  db-config:
  storage-data:
